    <!-- Immediate Theme Restoration for HTML Preloader Sync -->
    <style>
      :root {
        --color-primary: #2a9d8f;
        --color-primary-dark: #264653;
        --color-primary-container: #1c695f;
        --color-accent: #e9c46a;
        --color-secondary: #f4a261;
        --color-action: #e76f51;
        --color-surface: #e8eddf;

        --dark-green: #264653;
        --teal: #2a9d8f;
        --dark-teal: #1c695f;
        --yellow: #e9c46a;
        --light-orange: #f4a261;
        --orange: #e76f51;
        --white: #e8eddf;
      }
    </style>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('inquizitive-storage');
          if (raw) {
            var data = JSON.parse(raw);
            if (data && data.state && data.state.theme) {
              var theme = data.state.theme;
              var root = document.documentElement;
              var primaryDark = theme.primaryDark || theme.darkGreen || '#264653';
              var primary = theme.primary || theme.teal || '#2a9d8f';
              var primaryContainer = theme.primaryContainer || theme.darkTeal || '#1c695f';
              var accent = theme.accent || theme.yellow || '#e9c46a';
              var secondary = theme.secondary || theme.lightOrange || '#f4a261';
              var action = theme.action || theme.orange || '#e76f51';
              var surface = theme.surface || theme.white || '#e8eddf';

              root.style.setProperty('--color-primary-dark', primaryDark);
              root.style.setProperty('--color-primary', primary);
              root.style.setProperty('--color-primary-container', primaryContainer);
              root.style.setProperty('--color-accent', accent);
              root.style.setProperty('--color-secondary', secondary);
              root.style.setProperty('--color-action', action);
              root.style.setProperty('--color-surface', surface);

              root.style.setProperty('--dark-green', primaryDark);
              root.style.setProperty('--teal', primary);
              root.style.setProperty('--dark-teal', primaryContainer);
              root.style.setProperty('--yellow', accent);
              root.style.setProperty('--light-orange', secondary);
              root.style.setProperty('--orange', action);
              root.style.setProperty('--white', surface);
            }
          }
        } catch(e) {}
      })();
    </script>

          100% { transform: scale(1) rotate(360deg); opacity: 0.8; }
        }
        .preloader-spinner {
          width: 60px;
          height: 60px;
          border: 6px solid var(--color-primary, var(--teal, #2a9d8f));
          border-top-color: var(--color-accent, var(--yellow, #e9c46a));
          border-radius: 50%;
          animation: spinPulse 1.5s ease-in-out infinite;
          margin-bottom: 20px;
        }
        .preloader-text {
          color: var(--color-surface, var(--white, #e8eddf));
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 2.5rem;
          font-weight: bold;
          letter-spacing: 2px;
          margin: 0;
        }
        .preloader-text span {

        }
        .preloader-subtext {

          font-family: system-ui, -apple-system, sans-serif;
          margin-top: 10px;
          font-size: 1.2rem;

    <noscript>
      <div style="padding: 40px; font-family: sans-serif; background-color: #264653; color: #e8eddf; max-width: 800px; margin: 0 auto; line-height: 1.6;">
        <h1>inQUIZitive - Modern Interactive Live Event Quiz Platform</h1>
        <p><strong>inQUIZitive</strong> is an automated, web-based Progressive Web App (PWA) designed for quizmasters, schools, colleges, and corporate trivia hosts to conduct multi-round live competitions with zero backend or server setup.</p>
        
        <h2>Key Features</h2>
        <ul>
          <li><strong>4 Interactive Game Modes:</strong> Rapid Fire, Spin Wheel, Tic-Tac-Toe Grid, and Speed Buzzer Mode.</li>
          <li><strong>Excel Question Bank Import:</strong> Upload .xlsx spreadsheets directly into the application with automatic layout auditing.</li>
          <li><strong>Live Scoreboard &amp; Leaderboard:</strong> Real-time score tracking, customizable team colors, and point management.</li>
          <li><strong>100% Offline Capability:</strong> Progressive Web App (PWA) architecture allowing complete offline execution.</li>
          <li><strong>Presenter Keyboard Shortcuts:</strong> Fast hotkey controls for live stage projection.</li>
        </ul>

        <h2>Frequently Asked Questions</h2>
        <h3>How do I import questions into inQUIZitive?</h3>
        <p>Upload a Microsoft Excel (.xlsx) file with standard columns for Round, Question, Option A, Option B, Option C, Option D, Answer, and Points.</p>

        <h3>Does inQUIZitive work offline?</h3>
        <p>Yes, once loaded, inQUIZitive runs 100% offline in your browser as a PWA.</p>
      </div>
