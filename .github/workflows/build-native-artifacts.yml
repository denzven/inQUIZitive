name: Build Native Apps (APK & Desktop)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web application & sync Capacitor
        run: npm run build:capacitor

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inQUIZitive-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Android Release APK (Unsigned)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inQUIZitive-android-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

  build-desktop:
    name: Build Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Desktop Binaries
        run: npm run electron:build

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inQUIZitive-desktop-${{ matrix.name }}
          path: |
            release-builds/*.exe
            release-builds/*.AppImage
            release-builds/*.dmg
            release-builds/*.deb
            release-builds/*.tar.gz
            release-builds/*.zip
          if-no-files-found: ignore
