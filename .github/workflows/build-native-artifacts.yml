name: Build Native Apps & Distribution Artifacts

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web-bundle:
    name: Build Web Static Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Package Web Bundle
        run: |
          mkdir -p dist/web
          cd dist && zip -r web/inQUIZitive-web-static.zip . -x "desktop/*" "android/*" "web/*"

      - name: Upload Web Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inQUIZitive-web-static-zip
          path: dist/web/inQUIZitive-web-static.zip

  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web application & sync Capacitor
        run: npm run build:capacitor

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug
          mkdir -p ../dist/android
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/android/inQUIZitive-android-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inQUIZitive-android-debug-apk
          path: dist/android/inQUIZitive-android-debug.apk

      - name: Build Android Release APK & AAB
        run: |
          cd android
          ./gradlew assembleRelease
          ./gradlew bundleRelease
          mkdir -p ../dist/android
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../dist/android/inQUIZitive-android-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist/android/inQUIZitive-android-release.aab

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inQUIZitive-android-release-unsigned-apk
          path: dist/android/inQUIZitive-android-release-unsigned.apk

      - name: Upload Release AAB Artifact (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: inQUIZitive-android-release-aab
          path: dist/android/inQUIZitive-android-release.aab

  build-desktop:
    name: Build Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Desktop Binaries
        run: npm run electron:build

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inQUIZitive-desktop-${{ matrix.name }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.msi
            dist/desktop/*.AppImage
            dist/desktop/*.dmg
            dist/desktop/*.deb
            dist/desktop/*.rpm
            dist/desktop/*.snap
            dist/desktop/*.tar.gz
            dist/desktop/*.zip
          if-no-files-found: ignore

  bundle-all-artifacts:
    name: Package All Formats into 1 Master Zip
    needs: [build-web-bundle, build-android, build-desktop]
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: master-dist

      - name: Organize master distribution folder
        run: |
          mkdir -p inQUIZitive-all-platforms/windows
          mkdir -p inQUIZitive-all-platforms/macos
          mkdir -p inQUIZitive-all-platforms/linux
          mkdir -p inQUIZitive-all-platforms/android
          mkdir -p inQUIZitive-all-platforms/web

          if [ -d "master-dist/inQUIZitive-desktop-windows" ]; then
            cp -r master-dist/inQUIZitive-desktop-windows/* inQUIZitive-all-platforms/windows/ 2>/dev/null || true
          fi

          if [ -d "master-dist/inQUIZitive-desktop-macos" ]; then
            cp -r master-dist/inQUIZitive-desktop-macos/* inQUIZitive-all-platforms/macos/ 2>/dev/null || true
          fi

          if [ -d "master-dist/inQUIZitive-desktop-linux" ]; then
            cp -r master-dist/inQUIZitive-desktop-linux/* inQUIZitive-all-platforms/linux/ 2>/dev/null || true
          fi

          if [ -d "master-dist/inQUIZitive-android-debug-apk" ]; then
            cp -r master-dist/inQUIZitive-android-debug-apk/* inQUIZitive-all-platforms/android/ 2>/dev/null || true
          fi
          if [ -d "master-dist/inQUIZitive-android-release-unsigned-apk" ]; then
            cp -r master-dist/inQUIZitive-android-release-unsigned-apk/* inQUIZitive-all-platforms/android/ 2>/dev/null || true
          fi
          if [ -d "master-dist/inQUIZitive-android-release-aab" ]; then
            cp -r master-dist/inQUIZitive-android-release-aab/* inQUIZitive-all-platforms/android/ 2>/dev/null || true
          fi

          if [ -d "master-dist/inQUIZitive-web-static-zip" ]; then
            cp -r master-dist/inQUIZitive-web-static-zip/* inQUIZitive-all-platforms/web/ 2>/dev/null || true
          fi

          zip -r inQUIZitive-all-platforms-bundle.zip inQUIZitive-all-platforms

      - name: Upload Master Single Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inQUIZitive-all-platforms-bundle
          path: inQUIZitive-all-platforms-bundle.zip
